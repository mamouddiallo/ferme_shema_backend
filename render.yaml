# Blueprint Render — Infrastructure as Code.
# Déploiement : Dashboard Render → New → Blueprint → sélectionner ce dépôt.
# Render lit ce fichier et crée automatiquement les 3 ressources ci-dessous.
# CONFIGURATION GRATUITE, POUR TESTS : voir docs/DEPLOIEMENT_RENDER.md.
#
# Toute variable marquée `sync: false` doit être saisie une fois, à la main,
# dans le Dashboard Render après la création du Blueprint — jamais commitée.
#
# Note : un envVarGroup ne peut contenir que des valeurs simples (value/sync),
# jamais de référence fromDatabase/fromService — celles-ci doivent être
# déclarées directement dans le service qui en a besoin. Si un worker Celery
# est ajouté plus tard, ces références devront y être répétées.

envVarGroups:
  - name: ferme-shema-env
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false # Génère-la avec : python -c "import secrets; print(secrets.token_urlsafe(50))"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # ex: ferme-shema-api.onrender.com (ou ton domaine personnalisé)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # URL réelle du futur frontend, ex: https://app.fermeshema.com
      - key: SEUIL_ALERTE_MORTALITE_PCT
        value: "5.0"
      - key: SENTRY_DSN
        sync: false # Optionnel — laisser vide désactive Sentry proprement
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false # Compte propriétaire créé au premier démarrage
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false # À supprimer du Dashboard après la première connexion réussie

databases:
  - name: ferme-shema-db
    databaseName: ferme_shema_prod
    user: ferme_shema_user
    plan: free # Expire 30 jours après création (14 jours de grâce, puis suppression),
    # sans sauvegarde : réservé aux tests. Passer à un plan payant avant d'y mettre
    # de vraies données.

services:
  - type: web
    name: ferme-shema-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "/bin/bash -c 'python manage.py migrate --noinput && (python manage.py createsuperuser --noinput || true) && gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2'"
    plan: free
    healthCheckPath: /health/
    envVars:
      - fromGroup: ferme-shema-env
      - key: DB_NAME
        fromDatabase:
          name: ferme-shema-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ferme-shema-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ferme-shema-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: ferme-shema-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ferme-shema-db
          property: port
      - key: REDIS_URL
        fromService:
          name: ferme-shema-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: ferme-shema-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Liste vide = aucun accès public depuis internet ;
    # les connexions internes via fromService (ci-dessus) restent fonctionnelles.
